<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Py the friendly snake">
  <!-- one simple thick curve, no gradients, no fine detail, made for young beginners -->
  <path
    d="M 96 88
       C 96 104 76 112 55 108
       C 32 104 16 86 18 63
       C 20 41 39 26 60 30"
    fill="none"
    stroke="#7c3aed"
    stroke-width="28"
    stroke-linecap="round"
  />

  <!-- big friendly head -->
  <circle cx="62" cy="33" r="23" fill="#7c3aed" />

  <!-- rosy cheeks -->
  <ellipse cx="45" cy="38" rx="5.5" ry="4" fill="#f9a8d4" opacity="0.7" />
  <ellipse cx="79" cy="38" rx="5.5" ry="4" fill="#f9a8d4" opacity="0.7" />

  <!-- big simple eyes -->
  <circle cx="53" cy="29" r="7.5" fill="#0f172a" />
  <circle cx="71" cy="29" r="7.5" fill="#0f172a" />
  <circle cx="55.5" cy="26.5" r="2.6" fill="#fff" />
  <circle cx="73.5" cy="26.5" r="2.6" fill="#fff" />

  <!-- big happy smile -->
  <path d="M 50 42 Q 62 52 74 42" stroke="#0f172a" stroke-width="3.4" fill="none" stroke-linecap="round" />
</svg>
